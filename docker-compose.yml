version: '3.8'

networks:
  algafood-network:
    driver: bridge

volumes:
  pgdata:

services:
  algafood-postgres:
    image: postgres:latest
#    command: ["psql", "-U", "postgres", "-c" ,"CREATE DATABASE algafood;"]
    environment:
      POSTGRES_PASSWORD: 'postgres'
    volumes:
     - pgdata:/var/lib/postgresql/data
     - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    networks:
      - algafood-network

  algafood-redis:
    image: redis:latest
    networks:
      - algafood-network


  algafood-api:
    #    build: .
    #    image: cristianpuhl/algafood-api
    image: algafood-api
    command: ["/wait-for-it.sh", "algafood-postgres:5432", "-t", "30", "--", "java", "-jar", "api.jar"]
    environment:
      DB_HOST: algafood-postgres
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_REDIS_HOST: algafood-redis
#    ports:
#      - '8080:8080'
    networks:
      - algafood-network
    depends_on:
      - algafood-postgres

  algafood-proxy:
    build: ./nginx
    image: algafood-proxy
    ports:
      - "80:80"
    networks:
      - algafood-network
    depends_on:
      - algafood-api